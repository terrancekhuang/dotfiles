# Configuring hypridle
# See: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# 
# hypridle.conf - Hypridle configuration for HyDE
# Handles idle actions: dim, lock, DPMS, suspend, and custom listeners
# 
# Listeners: Each listener block defines an idle timeout and actions to run
# 
# For more info, see: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

#!      ░▒▒▒░░░▓▓           ___________
#!    ░░▒▒▒░░░░░▓▓        //___________/
#!   ░░▒▒▒░░░░░▓▓     _   _ _    _ _____
#!   ░░▒▒░░░░░▓▓▓▓▓ | | | | |  | |  __/
#!    ░▒▒░░░░▓▓   ▓▓ | |_| | |_/ /| |___
#!     ░▒▒░░▓▓   ▓▓   \__  |____/ |____/
#!       ░▒▓▓   ▓▓  //____/

$LOCK_CMD = hyde-shell lockscreen.sh # Calls $LOCKSCREEN default is hyprlock
$UNLOCK_CMD = sh -c 'sleep 3 && pkill -9 $(hyde-shell lockscreen --get)' # kills the lockscreen after 3 seconds for cleanup

general {
    lock_cmd = pidof hyprlock || $LOCK_CMD # avoid stacking duplicate lock instances
    unlock_cmd = $UNLOCK_CMD # command when `loginctl unlock-session` is called
    ignore_dbus_inhibit = false             # Ignore dbus idle-inhibit requests (false = respect them)
    ignore_systemd_inhibit = false          # Ignore systemd-inhibit --what=idle (false = respect them)
    before_sleep_cmd = loginctl lock-session    # ensures a clean lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on # forces display back on for NVIDIA
}

# // --- Listener: Screensaver after 120s (2 minutes) idle ---
listener {
    timeout = 120
    on-timeout = pkill hyprpaper; mpvpaper -l overlay '*' -o "loop panscan=1.0" ~/Pictures/Wallpapers/Knight\ Animated.mp4
    on-resume = killall mpvpaper; pidof hyprpaper || hyprpaper &
}

# // --- Listener: Lock after 300s (5 minutes) idle ---
# Locks the session before DPMS off, so the screen is not visible after wake
# Kills the screensaver here too, so it can't flash back into view on wake/unlock
listener {
    timeout = 300
    on-timeout = killall mpvpaper; pidof hyprpaper || hyprpaper & loginctl lock-session # Try system lock, fallback to $LOCKSCREEN
}

# // --- Listener: DPMS off after 360s (6 minutes) idle ---
# Turns off display (but not if media is playing)
listener {
    timeout = 360
    on-timeout = ~/.config/hypr/scripts/dpms-safe-off.sh        # Turn off display
    on-resume = hyprctl eval 'hl.dispatch(hl.dsp.dpms("on"))'   # Turn display back on
}

# // --- Listener: Suspend after 500s idle ---
# listener {
#     timeout = 500
#     on-timeout = systemctl suspend # Suspend system
# }

# // --- Custom listeners ---
# hyprlang noerror true
# Source any additional listener configs from this path (wildcard supported)
# Note: 'source' command is not implemented yet in hyprlang, but left for future use
source = ./hypridle/*
# hyprlang noerror false
